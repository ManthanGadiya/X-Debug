[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdebug-backend"
version = "0.1.0"
description = "Backend services for the XDebug explainable AI debugging assistant."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Manthan Gadiya" }]
keywords = ["debugging", "static-analysis", "explainable-ai", "fastapi", "program-analysis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pathspec>=0.12,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "tree-sitter>=0.26,<1.0",
    "tree-sitter-c>=0.24,<1.0",
    "tree-sitter-cpp>=0.23,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.10,<26.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
parallel = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
exclude = [".xdebug-workspace"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "T20", "D"]
ignore = ["B008", "D104", "D107", "D203", "D212", "D213"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["app.tests.*"]
disallow_untyped_defs = false
